services:
  - type: web
    name: temple-writer-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_TOKEN_PEPPER
        generateValue: true
      - key: TEMPLE_TZ
        value: Asia/Kolkata
      - key: WEB_ORIGIN
        sync: false # where the admin web app is served from (CORS allow-list)
